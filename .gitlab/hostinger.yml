hostinger-production:
  stage: deploy
  image: node:24-bookworm
  tags: [white-gloss-website]
  environment:
    name: production
    url: https://white-gloss.de
  resource_group: white-gloss-hostinger-production
  interruptible: false
  timeout: 25 minutes
  needs:
    - job: schema
      artifacts: false
    - job: verify
      artifacts: true
    - job: flows
      artifacts: false
    - job: studio
      artifacts: false
    - job: cross-browser
      artifacts: false
  rules:
    - if: '$CI_SERVER_HOST == "gitlab-p1va.srv2077393.hstgr.cloud" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
      when: on_success
  allow_failure: false
  # Only this job receives the protected production-scoped SSH file variables.
  script:
    - bash scripts/deploy-gitlab-hostinger.sh
